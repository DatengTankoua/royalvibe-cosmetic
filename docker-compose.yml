services:
  mongo:
    image: mongo:7
    # Variables à défaut stable : le smoke test isolé de 0B.7C injecte de
    # nouvelles valeurs via un projet Compose explicite (-p heyama_phase0b7c_smoke)
    # pour rester 100 % hermétique (nom de conteneur unique, port hôte distinct).
    # La configuration de DEV réelle est inchangée (défauts ci-dessous).
    container_name: ${MONGO_SERVICE_CONTAINER_NAME:-heyama-mongo}
    restart: unless-stopped
    # Replica set mono-nœud « rs0 » (phase 0B.7C) : prérequis local des
    # transactions multi-documents (écriture atomique vente–stock–audit, 0B.7B).
    # Les données du volume mongo_data sont CONSERVÉES ; l'initialisation est
    # idempotente et gérée par le service compagnon mongo-rs-init (jamais de
    # réinitialisation, jamais de perte de données).
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "${MONGO_SERVICE_HOST_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    # Healthy dès que le listener accepte `ping` EN LOCAL (127.0.0.1) —
    # fonctionne avant comme après l'initiation de « rs0 » (ping ne requiert
    # pas la topologie du replica set), sans secret, sans écriture.
    # C'est cette condition qui protège mongo-rs-init contre l'ECONNREFUSED
    # de la toute première connexion mongosh (le fichier JS ne court que
    # QUAND mongosh est déjà connecté).
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --host
        - "127.0.0.1"
        - --port
        - "27017"
        - --eval
        - "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 5s

  mongo-rs-init:
    image: mongo:7
    restart: "no"
    # Démarrage uniquement une fois Mongo HEALTHY (listener opérationnel) :
    # corrige l'ECONNREFUSED observé lors de la première activation, où
    # mongosh devait se connecter avant d'exécuter le script.
    depends_on:
      mongo:
        condition: service_healthy
    # Ponctuel et idempotent : détecte le replica set existant et n'initiate()
    # que s'il est absent ; exit 0 si déjà opérationnel, exit 1 en cas de
    # échec (le conteneur reste Exited (1) et ne redémarre pas).
    command: >-
      mongosh --quiet
      mongodb://mongo:27017/admin?directConnection=true
      /scripts/mongo/init-replica-set.js
    volumes:
      - ./scripts/mongo/init-replica-set.js:/scripts/mongo/init-replica-set.js:ro

  minio:
    image: minio/minio:latest
    container_name: heyama-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
  mongo-express:
    image: mongo-express:latest
    # Variables à défaut stable : le smoke test isolé de 0B.7C injecte de
    # nouvelles valeurs (nom de conteneur unique, port hôte distinct) via un
    # projet Compose explicite. La DEV réelle est inchangée (défauts ci-dessous).
    container_name: ${MONGO_EXPRESS_CONTAINER_NAME:-heyama-mongo-express}
    restart: unless-stopped
    ports:
      - "${MONGO_EXPRESS_HOST_PORT:-8081}:8081"
    environment:
      # Mongo Express partage le réseau Docker du projet et résout « mongo » ;
      # replicaSet=rs0 le fait rejoindre la replica set (pas de
      # directConnection : il utilise la topologie du replica set).
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/?replicaSet=rs0
      ME_CONFIG_BASICAUTH: "false"
    # Démarrage uniquement APRÈS la réussite de l'initialisation du replica set
    # (service_completed_successfully) : ne dépend plus directement de mongo.
    depends_on:
      mongo-rs-init:
        condition: service_completed_successfully

volumes:
  mongo_data:
  minio_data:
