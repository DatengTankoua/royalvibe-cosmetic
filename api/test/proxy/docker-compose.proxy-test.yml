# 1-14D.2E — Surcharge de TEST de docker-compose.prod.yml (harnais proxy).
#
# Usage UNIQUEMENT via `node api/test/proxy/run-proxy-check.js`, qui fixe un
# nom de projet isolé et un fichier d'environnement de TEST. Reprend la
# topologie RÉELLE de production (réseaux `default` et `edge`, adresse fixe
# de nginx, alias `api-edge`, aucun port API publié), le VRAI nginx.conf et
# la VRAIE image API (api/Dockerfile). Ne remplace que ce qui est nécessaire
# à l'isolement :
# - aucun port publié sur l'hôte, aucun volume de données nommé ;
# - web et minio remplacés par des conteneurs inertes (noms DNS seulement) ;
# - certificats de test générés, fixture d'observation de `req.ip` montée
#   UNIQUEMENT ici (aucune route de diagnostic dans l'image) ;
# - réseau `internet` simulant des clients aux adresses sources DISTINCTES.

services:
  mongo:
    container_name: !reset null
    restart: "no"
    volumes: !reset []

  minio:
    image: alpine:latest
    container_name: !reset null
    restart: "no"
    command: ["sleep", "infinity"]
    ports: !reset []
    volumes: !reset []
    environment: !reset {}

  web:
    build: !reset null
    image: alpine:latest
    container_name: !reset null
    restart: "no"
    command: ["sleep", "infinity"]

  api:
    image: heyama-proxytest-api:14d2e
    container_name: !reset null
    restart: "no"
    # Migrations des index (requises en production), puis bootstrap RÉEL
    # (`dist/main`) précédé de la fixture d'observation.
    command:
      - sh
      - -c
      - >-
        node dist/migrations/create-sale-operations-index.js &&
        node dist/migrations/create-subscription-period-indexes.js &&
        node dist/migrations/create-subscription-payment-indexes.js &&
        node /proxytest/observe-boot.js
    volumes:
      - ./api/test/proxy:/proxytest:ro
      - ${PROXYTEST_OBSERVE_DIR:?}:/observe

  nginx:
    container_name: !reset null
    restart: "no"
    ports: !reset []
    volumes: !override
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${PROXYTEST_CERTS_DIR:?}:/etc/nginx/certs:ro
    networks:
      internet:
        ipv4_address: 172.31.252.2

  # Clients « Internet » : adresses sources RÉELLES et distinctes.
  client-a:
    image: node:22.17.1-alpine3.22
    profiles: ["clients"]
    volumes:
      - ./api/test/proxy:/proxytest:ro
    networks:
      internet:
        ipv4_address: 172.31.252.10

  client-b:
    image: node:22.17.1-alpine3.22
    profiles: ["clients"]
    volumes:
      - ./api/test/proxy:/proxytest:ro
    networks:
      internet:
        ipv4_address: 172.31.252.11

  # Accès DIRECT à l'API sans passer par nginx (autre conteneur du projet).
  attacker-default:
    image: node:22.17.1-alpine3.22
    profiles: ["clients"]
    volumes:
      - ./api/test/proxy:/proxytest:ro
    networks:
      - default

  # Accès DIRECT depuis le réseau `edge` avec une adresse autre que nginx.
  attacker-edge:
    image: node:22.17.1-alpine3.22
    profiles: ["clients"]
    volumes:
      - ./api/test/proxy:/proxytest:ro
    networks:
      edge:
        ipv4_address: 172.31.250.3

networks:
  internet:
    ipam:
      config:
        - subnet: 172.31.252.0/24
          # Adresses fixes (nginx .2, clients .10/.11) hors de la plage dynamique.
          ip_range: 172.31.252.128/25
