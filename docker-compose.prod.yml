services:
  mongo:
    image: mongo:7
    container_name: royalvibe-mongo
    restart: always
    # MongoDB sans port exposé à l'extérieur — accès interne uniquement
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: royalvibe
    volumes:
      - mongo_data:/data/db

  minio:
    image: minio/minio:latest
    container_name: royalvibe-minio
    restart: always
    command: server /data --console-address ":9001"
    # Expose uniquement la console admin, pas l'API S3 (derrière Nginx)
    ports:
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: royalvibe-api
    restart: always
    depends_on:
      - mongo
      - minio
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/royalvibe?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${WEB_URL}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_USER}
      S3_SECRET_KEY: ${MINIO_PASSWORD}
      S3_BUCKET: royalvibe-objects
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL}
    container_name: royalvibe-web
    restart: always
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL}

  nginx:
    image: nginx:alpine
    container_name: royalvibe-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
      - minio

volumes:
  mongo_data:
  minio_data:
