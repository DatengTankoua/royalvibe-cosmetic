services:
  mongo:
    image: mongo:7
    container_name: royalvibe-mongo
    restart: always
    # MongoDB sans port exposé à l'extérieur — accès interne uniquement
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: royalvibe
    volumes:
      - mongo_data:/data/db

  minio:
    image: minio/minio:latest
    container_name: royalvibe-minio
    restart: always
    command: server /data --console-address ":9001"
    # Expose uniquement la console admin, pas l'API S3 (derrière Nginx)
    ports:
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: royalvibe-api
    restart: always
    depends_on:
      - mongo
      - minio
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/royalvibe?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${WEB_URL}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_USER}
      S3_SECRET_KEY: ${MINIO_PASSWORD}
      S3_BUCKET: royalvibe-objects
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      # Origine des liens d'invitation (1-12G, aucun email envoyé) : par
      # défaut l'URL publique du frontend, jamais l'en-tête Host.
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-${WEB_URL}}
      # Vérification des emails (1-13A) : clé Resend (secret) et expéditeur
      # d'un domaine vérifié. Vides → envoi indisponible (erreur contrôlée).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Inscription publique fermée par défaut (seule la valeur exacte `true` l'ouvre).
      PUBLIC_REGISTRATION_ENABLED: ${PUBLIC_REGISTRATION_ENABLED:-false}
      # 1-14D.2E — Seule l'adresse FIXE de nginx sur le réseau `edge` est un
      # proxy approuvé (`req.ip` = client vu par nginx). Un accès direct
      # depuis un autre conteneur (web, minio, mongo, réseau `default`) n'est
      # jamais approuvé : son `X-Forwarded-For` est ignoré. `TRUST_PROXY_HOPS`
      # n'est volontairement PAS transmis : dans cette topologie, plusieurs
      # chemins mènent à l'API et un nombre de sauts ne serait pas sûr.
      TRUST_PROXY_ADDRESSES: ${PROXY_NGINX_EDGE_ADDRESS:-172.31.250.2}
    # Aucun port publié : l'API n'est joignable QUE depuis les réseaux Docker
    # du projet ; depuis Internet, uniquement à travers nginx.
    networks:
      default: {}
      edge:
        aliases:
          - api-edge

  web:
    build:
      # Contexte racine (1-12E) : lockfile et workspace pnpm disponibles.
      context: .
      dockerfile: web/Dockerfile
      args:
        # Variables publiques uniquement (inlinées au build).
        NEXT_PUBLIC_API_URL: ${API_URL}
        NEXT_PUBLIC_REGISTRATION_ENABLED: ${NEXT_PUBLIC_REGISTRATION_ENABLED:-false}
        S3_HOSTNAME: ${S3_HOSTNAME:-}
    container_name: royalvibe-web
    restart: always
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: royalvibe-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    # 1-14D.2E — Adresse FIXE sur `edge` : l'unique proxy approuvé par l'API.
    networks:
      default: {}
      edge:
        ipv4_address: ${PROXY_NGINX_EDGE_ADDRESS:-172.31.250.2}
    depends_on:
      - api
      - web
      - minio

# 1-14D.2E — Réseau dédié nginx ↔ API, sous-réseau fixe (adresse de nginx
# déterministe). Seuls nginx et l'API y sont attachés. L'allocation
# DYNAMIQUE (API) est limitée à `ip_range`, qui EXCLUT l'adresse fixe de
# nginx : sinon l'API, démarrée avant nginx, pourrait recevoir cette adresse
# (constaté par le harnais : « Address already in use »). À adapter
# ensemble si le sous-réseau entre en conflit avec un réseau de l'hôte.
networks:
  edge:
    ipam:
      config:
        - subnet: ${PROXY_EDGE_SUBNET:-172.31.250.0/29}
          ip_range: ${PROXY_EDGE_DYNAMIC_RANGE:-172.31.250.4/30}

volumes:
  mongo_data:
  minio_data:
