events { worker_connections 1024; }

http {
  # ── Sécurité globale ───────────────────────────────────────────────────────
  server_tokens off;
  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy strict-origin-when-cross-origin;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";

  # ── Redirection HTTP → HTTPS ───────────────────────────────────────────────
  server {
    listen 80;
    server_name royalvibe.tondomaine.com api.royalvibe.tondomaine.com s3.royalvibe.tondomaine.com;
    return 301 https://$host$request_uri;
  }

  # ── Web (Next.js) ─────────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name royalvibe.tondomaine.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20M;

    location / {
      proxy_pass         http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }

  # ── API (NestJS) ──────────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name api.royalvibe.tondomaine.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20M;

    location / {
      proxy_pass         http://api:4000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }

  # ── MinIO S3 (accès public aux images) ────────────────────────────────────
  server {
    listen 443 ssl;
    server_name s3.royalvibe.tondomaine.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 50M;

    location / {
      proxy_pass         http://minio:9000;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
    }
  }
}
