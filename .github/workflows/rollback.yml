name: Manual Rollback

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to rollback"
        required: true
        type: choice
        options:
          - web
          - api
          - both
      target_sha:
        description: "Commit SHA to rollback to (Railway only — leave empty for previous deploy)"
        required: false
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ── Rollback Next.js on Vercel (instant — no rebuild needed) ─────────────────
  rollback-web:
    name: Rollback Web → Vercel
    if: inputs.service == 'web' || inputs.service == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Rollback to previous Vercel deployment
        run: npx --yes vercel rollback --yes --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── Rollback NestJS API on Railway ───────────────────────────────────────────
  rollback-api:
    name: Rollback API → Railway
    if: inputs.service == 'api' || inputs.service == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Checkout target SHA if provided, otherwise HEAD~1
          ref: ${{ inputs.target_sha || '' }}
          fetch-depth: 0
      - name: Resolve and log target SHA
        run: |
          echo "Rolling back API to: $(git rev-parse HEAD)"
      - name: Redeploy target SHA to Railway
        run: npx --yes @railway/cli@latest up --service api --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
