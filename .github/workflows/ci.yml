name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # 1-16G : ressources FR/EN (clés, variables, pluriels, rendu anglais sans
      # repli français) et inventaire des textes visibles non traduits.
      - run: pnpm test:i18n
      - run: pnpm i18n:coverage
      - run: pnpm build
      # 1-16C.2 : le texte servi des documents soumis à acceptation doit être
      # identique à l'archive de sa version (api/src/legal/archive), pour
      # chaque langue publiée (1-16G : rendu dynamique, `next start` lancé
      # par le script).
      - run: node scripts/legal-archive.mjs check --next-dir .next
